name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from packageManager in package.json and from nowhere else.
      # Declaring it here as well makes action-setup fail on the mismatch, and
      # two places owning one fact is the defect this project exists to prevent.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Types come from the pack. Generating here proves a fresh clone can do it.
      - name: generate types from contracts
        run: pnpm gen

      - name: typecheck
        run: pnpm typecheck

      # S-1, S-2, S-3, S-4, S-5, S-6, S-7, S-8, S-10 all live here: each test name
      # carries the id of the invariant it enforces.
      - name: tests and structural invariants
        run: pnpm test

      # Same rules as the boundaries test, run standalone so the CI log names
      # the violated rule directly.
      - name: boundaries
        run: pnpm boundaries

      # The metadata contract. A markdown formatter can destroy frontmatter
      # silently — it already did once — and until this step existed nothing in
      # CI would have noticed a corrupted document reaching the branch.
      - name: docs metadata and DAG
        run: pnpm lint:docs

      # INV-01: one owner per fact class. Dual-owner or dual-path is exit 6,
      # not a winner picked from conflict_resolution.
      - name: authority map
        run: pnpm lint:authority

      # INV-10: T0 keys from seed-public-keys/ before the manifest. A fresh
      # clone must pass this without a manual key step.
      - name: bootstrap verifier
        run: pnpm verify

      # DEV-04: schema-validate registry, boundary, matrix and fixtures.
      - name: schema validate
        run: pnpm validate

      # DEV-06: unique alias index, PROTO-01/02/08/09. Does not write the workspace.
      - name: compile registry
        run: pnpm compile:registry

      # DEV-07: SourceRef from the repository root, never the pack root.
      - name: resolve sourceref
        run: pnpm resolve glt-specpack/docs/SPEC/registry.md

      # DEV-08: deterministic snapshot to stdout. Does not write the workspace.
      - name: compile snapshot
        run: pnpm compile:snapshot -- --as-of 2026-08-14T10:00:00Z

      # DEV-09: intended meta-graph from DEV frontmatter. Slice stays the digest oracle.
      - name: compile intended snapshot
        run: pnpm compile:snapshot -- --as-of 2026-08-14T10:00:00Z --boundary glt.controlplane-intended@1

      # DEV-10: impact report to stdout. Does not write the workspace.
      - name: impact
        run: pnpm impact -- --snapshot glt-specpack/contracts/examples/golden/bootstrap-snapshot.json

      # DEV-11: S1–S3 injections and the open seeded change set. Not holdout.
      - name: seeded failures
        run: pnpm test:seeded

      # DEV-12: correctness gate. Recall on the open set; holdout H01–H05 is E03 only.
      - name: correctness gate
        run: pnpm test:gate

      # S-9 is warning severity: dead code is reported, not blocking.
      - name: dead code
        run: pnpm deadcode
        continue-on-error: true
