# Self-host stack (DEV-25). Pulled images are pinned by digest, not tag.
# Secrets come from deploy/.env. The CLI has no deploy verb.
name: glt

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: glt-controlplane-api
    environment:
      HOST: "0.0.0.0"
      PORT: "4174"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: glt
      POSTGRES_DB: glt
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in deploy/.env}"
    ports:
      - "127.0.0.1:4174:4174"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: glt
      POSTGRES_DB: glt
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in deploy/.env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glt -d glt"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0@sha256:38c349c3b7a2fd7ea46700cde8fa13d35b699ef2ce245bdf34dae2a413512f76
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

volumes:
  postgres_data:
