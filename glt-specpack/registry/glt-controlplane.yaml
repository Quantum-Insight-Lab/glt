apiVersion: glt.dev/registry/v1
kind: RegistryBundle
metadata:
  version: 0.2.0
  boundary: glt.bootstrap-slice@1
  namespace: glt.controlplane
spec:
  entries:
    - apiVersion: glt.dev/v1alpha1
      kind: RegistryEntry
      metadata:
        id: glt.controlplane.registry.entry
        revision: 1
        namespace: glt.controlplane
        aliases: ["⟁REG"]
        title: Registry Entry
      spec:
        kind: node
        description: Meta-node for registry entries in the bootstrap slice.
        schema_ref: https://glt.dev/schemas/v1alpha1/registry-entry.schema.json
        node:
          type: domain
          lifecycle: planned
          owner: registry
          criticality: high
          sensitivity: internal
          sources:
            - repository: glt-controlplane
              path: glt-specpack/docs/SPEC/registry.md
              authority: glt-id-registry
              role: contract
          delivery:
            expectedFromStep: glt.dev.06
            gate: glt.controlplane.gate.bootstrap
            status: planned

    - apiVersion: glt.dev/v1alpha1
      kind: RegistryEntry
      metadata:
        id: glt.controlplane.compiler
        revision: 1
        namespace: glt.controlplane
        aliases: ["⟁COMP"]
        title: Snapshot Compiler
      spec:
        kind: node
        description: Compiles registry and evidence into an immutable topology snapshot.
        schema_ref: https://glt.dev/schemas/v1alpha1/snapshot.schema.json
        node:
          type: tool
          lifecycle: planned
          owner: engineering
          criticality: high
          sensitivity: internal
          sources:
            - repository: glt-controlplane
              path: glt-specpack/docs/SPEC/snapshots.md
              authority: engineering-contract
              role: contract
          capabilities:
            - glt.snapshot.compile
          delivery:
            expectedFromStep: glt.dev.08
            gate: glt.controlplane.gate.bootstrap
            status: planned

    - apiVersion: glt.dev/v1alpha1
      kind: RegistryEntry
      metadata:
        id: glt.controlplane.check
        revision: 1
        namespace: glt.controlplane
        aliases: ["⟁CHK"]
        title: Bootstrap Invariant Check
      spec:
        kind: check
        description: Runs the protocol invariant suite against golden fixtures.
        node:
          type: check
          lifecycle: planned
          owner: engineering
          criticality: high
          sensitivity: internal
          sources:
            - repository: glt-controlplane
              path: glt-specpack/docs/SPEC/invariants.md
              authority: engineering-contract
              role: contract
          capabilities:
            - glt.check.invariants
          delivery:
            expectedFromStep: glt.dev.02
            gate: glt.controlplane.gate.bootstrap
            status: planned

    - apiVersion: glt.dev/v1alpha1
      kind: RegistryEntry
      metadata:
        id: glt.controlplane.gate.bootstrap
        revision: 1
        namespace: glt.controlplane
        aliases: ["⟁GATE"]
        title: Bootstrap Pre-code Gate
      spec:
        kind: gate
        description: >
          Aggregates registry schema validation, snapshot compilation, the
          invariant suite and docs DAG acyclicity. Read/evaluate only in v1.
        node:
          type: gate
          lifecycle: planned
          owner: governance
          criticality: critical
          sensitivity: internal
          sources:
            - repository: glt-controlplane
              path: glt-specpack/docs/00-governance/pre-code-gate.md
              authority: governance-normativity
              role: contract
          delivery:
            expectedFromStep: glt.dev.09
            gate: glt.controlplane.gate.bootstrap
            status: planned

  edges:
    # Traversal of depends_on runs against the edge: a change to the registry
    # entry contract reaches the compiler that consumes it.
    - apiVersion: glt.dev/v1alpha1
      kind: Edge
      metadata:
        id: glt.edge.compiler-depends-registry
      spec:
        from: glt.controlplane.compiler
        to: glt.controlplane.registry.entry
        relation: depends_on
        assertions:
          - plane: intended
            status: asserted
            evidence:
              repository: glt-controlplane
              path: glt-specpack/docs/SPEC/snapshots.md
              authority: engineering-contract
              role: derived-from
          - plane: materialized
            status: not_observed
            evidence: null
          - plane: observed
            status: not_observed
            evidence: null
        propagation:
          change: [dependency, interface, schema]
          incident: [availability]

    - apiVersion: glt.dev/v1alpha1
      kind: Edge
      metadata:
        id: glt.edge.check-validates-compiler
      spec:
        from: glt.controlplane.check
        to: glt.controlplane.compiler
        relation: validates
        assertions:
          - plane: intended
            status: asserted
            evidence:
              repository: glt-controlplane
              path: glt-specpack/docs/SPEC/gates.md
              authority: engineering-contract
              role: derived-from
          - plane: materialized
            status: not_observed
            evidence: null
          - plane: observed
            status: not_observed
            evidence: null
        propagation:
          change: [behavior, content, interface, schema]
          incident: []

    - apiVersion: glt.dev/v1alpha1
      kind: Edge
      metadata:
        id: glt.edge.gate-gates-check
      spec:
        from: glt.controlplane.gate.bootstrap
        to: glt.controlplane.check
        relation: gates
        assertions:
          - plane: intended
            status: asserted
            evidence:
              repository: glt-controlplane
              path: glt-specpack/docs/00-governance/pre-code-gate.md
              authority: governance-normativity
              role: derived-from
          - plane: materialized
            status: not_observed
            evidence: null
          - plane: observed
            status: not_observed
            evidence: null
        propagation:
          change: []
          incident: []
